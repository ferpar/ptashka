# Included in every location. nginx gotcha: a location with *any* add_header of its own stops
# inheriting the server's add_header lines, so headers shared by all locations live in this snippet.
# `always`: also on error responses (4xx/5xx), not just successful ones.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
