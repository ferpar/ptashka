server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app's own pages: scripts and data only from our origin. 'unsafe-inline' styles because
    # Solid compiles static style={{...}} props into inline style attributes.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # Hashed assets (index-BjQMU4hK.js): the name changes with the content, so cache them forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the single-page app: unknown paths (/boards/3) get index.html and the
    # router takes it from there. Never cached, so a deploy is picked up on the next load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # API docs (Swagger UI loads its scripts from a CDN, so no CSP here) and health.
    location ~ ^/(docs|openapi\.json|health)$ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8020;
        proxy_set_header Host $host;
    }
}
