name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (types, tests on SQLite and Postgres, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ptashka
          POSTGRES_PASSWORD: ptashka
          POSTGRES_DB: ptashka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ptashka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PGPASSWORD: ptashka
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install
        run: uv venv --python 3.13 && uv pip install -e ".[dev]"
      - name: Type check
        run: .venv/bin/pyright
      - name: Tests (SQLite)
        run: .venv/bin/pytest -q
      - name: Tests (Postgres, including row-lock concurrency tests)
        run: |
          psql -h localhost -U ptashka -c "CREATE DATABASE ptashka_test"
          TEST_POSTGRES_URL=postgresql://ptashka:ptashka@localhost:5432/ptashka_test .venv/bin/pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql://ptashka:ptashka@localhost:5432/ptashka
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check-types
      - run: npx vitest run
      - run: npm run build

  api-contract:
    name: Frontend API types match the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv venv --python 3.13 && uv pip install -e .
      - run: cd frontend && npm ci && npm run gen:api
      - name: Fail if the API changed without regenerating the frontend's types
        run: |
          if ! git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts; then
            echo "::error::The API changed. Run 'npm run gen:api' in frontend/ and commit the result."
            exit 1
          fi

  docker:
    name: Images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag ptashka-backend backend
      - run: docker build --tag ptashka-frontend frontend
