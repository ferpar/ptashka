# Development compose - runs just the database.
# The backend (and later the frontend) run locally for hot-reload.

services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60s"]
    environment:
      POSTGRES_USER: ptashka
      POSTGRES_PASSWORD: ptashka
      POSTGRES_DB: ptashka
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptashka"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
