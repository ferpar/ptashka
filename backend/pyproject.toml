[project]
name = "ptashka"
version = "0.1.0"
description = "Trello-like task manager API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8.0",
    "alembic>=1.13.1",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptashka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["postgres: needs a real Postgres database (set TEST_POSTGRES_URL)"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
